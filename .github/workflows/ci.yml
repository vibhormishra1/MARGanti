name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Frontend Quality Gates ───────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build packages (required for typecheck)
        run: pnpm run build --filter='./packages/**'

      - name: Typecheck
        run: pnpm --filter web run typecheck

      - name: Build (all packages + web)
        run: pnpm run build

      - name: Dependency audit
        run: pnpm audit --audit-level=high
        continue-on-error: true  # Advisory — does not block until critical vulns are resolved

  # ── Backend Quality Gates ────────────────────────────────────────
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -v

  # ── Docker Build Validation ──────────────────────────────────────
  docker:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t marg-api:ci .

      - name: Verify API health
        run: |
          docker run -d --name marg-api-test \
            -e DATABASE_URL=sqlite+aiosqlite:///test.db \
            -e JWT_SECRET_KEY=ci-test-key-not-for-production \
            -e ENVIRONMENT=testing \
            -p 8000:8000 \
            marg-api:ci
          # Wait for container to be ready with retries
          for i in {1..30}; do
            if curl -f http://localhost:8000/api/liveness 2>/dev/null; then
              echo "API is healthy"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "API failed to start. Container logs:"
              docker logs marg-api-test
              exit 1
            fi
            echo "Attempt $i/30: Waiting for API to be ready..."
            sleep 1
          done
          
          docker stop marg-api-test
